# How dbt reaches Snowflake: as SVC_DBT, by key pair, as TRANSFORMER.
shopwave:
  target: prod
  outputs:
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: SVC_DBT
      private_key_path: "{{ env_var('HOME') }}/.keys/svc_dbt.p8"
      role: TRANSFORMER
      warehouse: WH_TRANSFORM
      database: ANALYTICS
      schema: MARTS
      threads: 4
