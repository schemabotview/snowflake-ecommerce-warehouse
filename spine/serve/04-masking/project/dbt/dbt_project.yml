# Shopwave's warehouse, as dbt builds it: staging views, then the marts.
name: shopwave
version: "1.0"
profile: shopwave
config-version: 2

model-paths: [models]
test-paths: [tests]
macro-paths: [macros]

models:
  shopwave:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      bi:
        +schema: bi
